name: Deploy Production

'on':
  workflow_dispatch:
  push:
    branches:
      - release

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_NAMESPACE: chenxi1280
  TGMSG_APP_IMAGE_NAME: tg-auto-msg-app
  TGMSG_FRONTEND_IMAGE_NAME: tg-auto-msg-frontend

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          set -euo pipefail
          ruff check backend tests --select F --ignore F401,F403,F405

      - name: Pylint
        run: |
          set -euo pipefail
          pylint backend tests --disable=all --enable=E0601,E0606

      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
          TG_API_ID: "123456"
          TG_API_HASH: "test-api-hash"
          BOT_TOKEN: "123456:test-bot-token"
          DATABASE_URL: "postgresql+asyncpg://tester:tester@localhost:5432/tg_auto_msg_test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test-secret-key"
        run: |
          set -euo pipefail
          python -m pytest -q

  build-images:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ env.TGMSG_APP_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=tgmsg-app
          cache-to: type=gha,mode=max,scope=tgmsg-app

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ env.TGMSG_FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=tgmsg-frontend
          cache-to: type=gha,mode=max,scope=tgmsg-frontend

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs:
      - checks
      - build-images

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deploy secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          test -n "${GHCR_TOKEN}"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          PORT="${DEPLOY_PORT:-22}"
          cat > ~/.ssh/config <<EOF
          Host production-server
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${PORT}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy via SSH release script
        env:
          PRODUCTION_BASE_DIR: ${{ vars.PRODUCTION_BASE_DIR }}
          RELEASE_BRANCHES: ${{ vars.RELEASE_BRANCHES }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          TGMSG_APP_IMAGE: ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ env.TGMSG_APP_IMAGE_NAME }}:${{ github.sha }}
          TGMSG_FRONTEND_IMAGE: ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ env.TGMSG_FRONTEND_IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          BASE_DIR="${PRODUCTION_BASE_DIR:-/data/tgmsg}"
          BRANCHES="${RELEASE_BRANCHES:-release master main}"
          bash deploy/release.sh \
            --host production-server \
            --base-dir "${BASE_DIR}" \
            --branch-list "${BRANCHES}"
