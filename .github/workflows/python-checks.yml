name: Python Checks

'on':
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          set -euo pipefail
          ruff check backend tests --select F --ignore F401,F403,F405

      - name: Pylint
        run: |
          set -euo pipefail
          pylint backend tests --disable=all --enable=E0601,E0606

      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
          TG_API_ID: "123456"
          TG_API_HASH: "test-api-hash"
          BOT_TOKEN: "123456:test-bot-token"
          DATABASE_URL: "postgresql+asyncpg://tester:tester@localhost:5432/tg_auto_msg_test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test-secret-key"
        run: |
          set -euo pipefail
          python -m pytest -q
