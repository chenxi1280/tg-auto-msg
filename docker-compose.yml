name: tgmsg

services:
  app:
    image: ${TGMSG_APP_IMAGE:-tgmsg-app:latest}
    container_name: tgmsg-app
    restart: unless-stopped
    environment:
      TG_API_ID: ${TG_API_ID:?TG_API_ID is required}
      TG_API_HASH: ${TG_API_HASH:?TG_API_HASH is required}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      USERBOT_PHONE: ${USERBOT_PHONE:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENCRYPTION_KEY_FALLBACKS: ${ENCRYPTION_KEY_FALLBACKS:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:-超级管理员}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
      TZ: ${TIMEZONE:-Asia/Shanghai}
      PROVINCE_CODE: ${PROVINCE_CODE:-default}
      H5_BASE_URL: ${H5_BASE_URL:-https://msg.telema.cn}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-60}
      MAX_FAILURE_COUNT: ${MAX_FAILURE_COUNT:-5}
      SCHEDULER_TASK_TIMEOUT_SECONDS: ${SCHEDULER_TASK_TIMEOUT_SECONDS:-360}
      SCHEDULER_TASK_CONCURRENCY: ${SCHEDULER_TASK_CONCURRENCY:-3}
      ACCOUNT_AUTO_SYNC_MAX_CANDIDATES_PER_RUN: ${ACCOUNT_AUTO_SYNC_MAX_CANDIDATES_PER_RUN:-1}
      ACCOUNT_AUTO_SYNC_SKIP_PROXY_ACCOUNTS: ${ACCOUNT_AUTO_SYNC_SKIP_PROXY_ACCOUNTS:-true}
      CLASH_ADDRESS_CONFIG_DIR: ${CLASH_ADDRESS_CONFIG_DIR:-/data/infra/sing-box}
      CLASH_ADDRESS_COMPOSE_DIR: ${CLASH_ADDRESS_COMPOSE_DIR:-/data/infra/compose}
      CLASH_ADDRESS_SUBSCRIPTION_URL_FILE: ${CLASH_ADDRESS_SUBSCRIPTION_URL_FILE:-/data/infra/sing-box/subscription.url}
      CLASH_ADDRESS_APPLY_COMMAND: ${CLASH_ADDRESS_APPLY_COMMAND:-bash /data/infra/compose/deploy/sync-sing-box.sh}
      CLASH_ADDRESS_APPLY_TIMEOUT_SECONDS: ${CLASH_ADDRESS_APPLY_TIMEOUT_SECONDS:-120}
      BIND_MAX_FAILURES: ${BIND_MAX_FAILURES:-8}
      BIND_FAILURE_WINDOW_SECONDS: ${BIND_FAILURE_WINDOW_SECONDS:-600}
      BIND_LOCK_SECONDS: ${BIND_LOCK_SECONDS:-900}
      SERVE_FRONTEND: ${SERVE_FRONTEND:-false}
    volumes:
      - ${APP_LOG_DIR:-/data/tgmsg/logs}:/app/logs
      - ${APP_UPLOAD_DIR:-/data/tgmsg/uploads}:/app/uploads
      - ${CLASH_ADDRESS_CONFIG_DIR:-/data/infra/sing-box}:${CLASH_ADDRESS_CONFIG_DIR:-/data/infra/sing-box}
      - ${CLASH_ADDRESS_COMPOSE_DIR:-/data/infra/compose}:${CLASH_ADDRESS_COMPOSE_DIR:-/data/infra/compose}:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${TGMSG_APP_BIND_HOST:-127.0.0.1}:${TGMSG_APP_HOST_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 180s
    networks:
      - default
      - infra_default

networks:
  infra_default:
    name: ${INFRA_NETWORK_NAME:-infra_default}
    external: true
