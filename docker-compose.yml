name: tgmsg

services:
  postgres:
    image: postgres:16-alpine
    container_name: tgmsg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tgmsg}
      POSTGRES_USER: ${POSTGRES_USER:-tgmsg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${POSTGRES_DATA_DIR:-/data/tgmsg/postgres}:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    image: redis:7-alpine
    container_name: tgmsg-redis
    restart: unless-stopped
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    ]
    volumes:
      - ${REDIS_DATA_DIR:-/data/tgmsg/redis}:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: tgmsg-app:latest
    container_name: tgmsg-app
    restart: unless-stopped
    environment:
      TG_API_ID: ${TG_API_ID:?TG_API_ID is required}
      TG_API_HASH: ${TG_API_HASH:?TG_API_HASH is required}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      USERBOT_PHONE: ${USERBOT_PHONE:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tgmsg}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tgmsg}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
      H5_BASE_URL: ${H5_BASE_URL:-http://47.250.167.174}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-60}
      MAX_FAILURE_COUNT: ${MAX_FAILURE_COUNT:-5}
      BIND_MAX_FAILURES: ${BIND_MAX_FAILURES:-8}
      BIND_FAILURE_WINDOW_SECONDS: ${BIND_FAILURE_WINDOW_SECONDS:-600}
      BIND_LOCK_SECONDS: ${BIND_LOCK_SECONDS:-900}
      SERVE_FRONTEND: ${SERVE_FRONTEND:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${APP_LOG_DIR:-/data/tgmsg/logs}:/app/logs
      - ${APP_UPLOAD_DIR:-/data/tgmsg/uploads}:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 6

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: tgmsg-frontend:latest
    container_name: tgmsg-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ${NGINX_LOG_DIR:-/data/tgmsg/nginx-logs}:/var/log/nginx
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
