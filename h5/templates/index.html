<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定时消息推送管理</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📢 定时消息推送管理</h1>
            <p>高级控制台</p>
        </header>

        <main>
            <div class="card">
                <h2>欢迎使用</h2>
                <p>请从 Bot 进入任务详情页进行管理</p>
                <div class="info-box">
                    <p>💡 <strong>提示：</strong></p>
                    <ul>
                        <li>在 Bot 中点击「🌐 H5 高级编辑」按钮</li>
                        <li>或通过 Bot 提供的链接访问</li>
                    </ul>
                </div>
            </div>

            <div class="features">
                <div class="feature-card">
                    <div class="feature-icon">📝</div>
                    <h3>富文本编辑</h3>
                    <p>支持 HTML 格式的富文本编辑</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🖼️</div>
                    <h3>媒体管理</h3>
                    <p>上传、预览、复用媒体素材</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🔘</div>
                    <h3>按钮编排</h3>
                    <p>可视化按钮布局编辑</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">📊</div>
                    <h3>批量操作</h3>
                    <p>批量启用/停用/修改任务</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
