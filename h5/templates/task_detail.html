<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务详情 - 定时消息推送</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <button class="back-btn" onclick="goBack()">← 返回</button>
            <h1>⚙️ 任务设置</h1>
        </header>

        <main>
            <div class="card">
                <div class="task-header">
                    <input type="text" id="taskTitle" class="task-title-input" value="{{ task.title }}">
                    <button class="btn btn-primary" onclick="saveTask()">💾 保存</button>
                </div>

                <div class="task-status">
                    <label class="toggle-switch">
                        <input type="checkbox" id="taskEnabled" {{ 'checked' if task.enabled else '' }}>
                        <span class="slider"></span>
                        <span class="toggle-label">{{ '已启用' if task.enabled else '已禁用' }}</span>
                    </label>
                </div>
            </div>

            <!-- 基本设置 -->
            <section class="section">
                <h2>📊 基本设置</h2>
                <div class="form-group">
                    <label>重复间隔（分钟）</label>
                    <input type="number" id="interval" value="{{ task.repeat_interval_min }}" min="1">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>群组/频道 ID</label>
                        <input type="number" id="chatId" value="{{ task.chat_id }}">
                    </div>
                </div>
            </section>

            <!-- 时间控制 -->
            <section class="section">
                <h2>⏰ 时间控制</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>每日时段开始</label>
                        <select id="dayStartHour">
                            {% for hour in range(24) %}
                            <option value="{{ hour }}" {{ 'selected' if task.day_start_hour == hour else '' }}>
                                {{ "%02d"|format(hour) }}:00
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>每日时段结束</label>
                        <select id="dayEndHour">
                            {% for hour in range(24) %}
                            <option value="{{ hour }}" {{ 'selected' if task.day_end_hour == hour else '' }}>
                                {{ "%02d"|format(hour) }}:00
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>开始时间</label>
                        <input type="datetime-local" id="startAt"
                            value="{{ task.start_at | datetime_local(task.start_at) if task.start_at else '' }}">
                    </div>
                    <div class="form-group">
                        <label>结束时间</label>
                        <input type="datetime-local" id="endAt"
                            value="{{ task.end_at | datetime_local(task.end_at) if task.end_at else '' }}">
                    </div>
                </div>
            </section>

            <!-- 消息内容 -->
            <section class="section">
                <h2>📝 消息内容</h2>
                <div class="form-group">
                    <label>文本内容（支持 HTML）</label>
                    <textarea id="text" rows="6" placeholder="请输入消息文本...">{{ task.text or '' }}</textarea>
                    <div class="char-count" id="charCount">0 / 4096</div>
                </div>
                <div class="form-group">
                    <label>媒体上传</label>
                    <div class="media-upload">
                        <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;">
                        <button class="btn btn-secondary" onclick="document.getElementById('mediaInput').click()">
                            📤 上传媒体
                        </button>
                        <span id="mediaStatus" class="media-status">
                            {% if task.media_type != 'none' %}
                                {{ task.media_type }}: {{ task.media_file_id[:20] }}...
                            {% else %}
                                未上传
                            {% endif %}
                        </span>
                    </div>
                </div>
            </section>

            <!-- 按钮编辑 -->
            <section class="section">
                <h2>🔘 按钮设置</h2>
                <div id="buttonEditor">
                    {% for row in task.buttons or [] %}
                    <div class="button-row">
                        {% for btn in row %}
                        <div class="button-item">
                            <input type="text" class="button-text" value="{{ btn.text }}" placeholder="按钮文字">
                            <input type="url" class="button-url" value="{{ btn.url }}" placeholder="URL">
                            <button class="btn btn-danger btn-sm" onclick="removeButton(this)">×</button>
                        </div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                </div>
                <button class="btn btn-secondary" onclick="addButtonRow()">+ 添加按钮行</button>
            </section>

            <!-- 执行选项 -->
            <section class="section">
                <h2>⚙️ 执行选项</h2>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="deletePrevious" {{ 'checked' if task.delete_previous else '' }}>
                        <span>删除上一条消息</span>
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="pinMessage" {{ 'checked' if task.pin_message else '' }}>
                        <span>置顶新消息</span>
                    </label>
                </div>
            </section>

            <!-- 发送日志 -->
            <section class="section">
                <h2>📋 发送日志</h2>
                <button class="btn btn-secondary btn-sm" onclick="loadLogs()">🔄 刷新日志</button>
                <div id="logsContainer" class="logs-container">
                    <p class="text-muted">点击刷新加载日志...</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        const taskId = '{{ task_id }}';
        const apiBase = '/api';

        // 字符计数
        document.getElementById('text').addEventListener('input', function() {
            const count = this.value.length;
            const counter = document.getElementById('charCount');
            counter.textContent = `${count} / 4096`;
            counter.style.color = count > 4096 ? '#ff4444' : '#666';
        });

        // 初始化字符计数
        document.getElementById('text').dispatchEvent(new Event('input'));

        // 媒体上传处理
        document.getElementById('mediaInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('mediaStatus').textContent = '上传中...';

            try {
                const formData = new FormData();
                formData.append('file', file);

                // TODO: 实现媒体上传 API
                // const response = await fetch(`${apiBase}/media/upload`, {
                //     method: 'POST',
                //     body: formData
                // });
                // const data = await response.json();

                // 临时模拟
                await new Promise(resolve => setTimeout(resolve, 1000));
                document.getElementById('mediaStatus').textContent = `${file.type.split('/')[0]}: ${file.name}`;
            } catch (error) {
                document.getElementById('mediaStatus').textContent = '上传失败';
                console.error('Upload error:', error);
            }
        });

        // 添加按钮行
        function addButtonRow() {
            const container = document.getElementById('buttonEditor');
            const row = document.createElement('div');
            row.className = 'button-row';
            row.innerHTML = `
                <div class="button-item">
                    <input type="text" class="button-text" placeholder="按钮文字">
                    <input type="url" class="button-url" placeholder="URL">
                    <button class="btn btn-danger btn-sm" onclick="removeButton(this)">×</button>
                </div>
            `;
            container.appendChild(row);
        }

        // 删除按钮
        function removeButton(btn) {
            const item = btn.parentElement;
            const row = item.parentElement;
            item.remove();
            if (row.children.length === 0) {
                row.remove();
            }
        }

        // 保存任务
        async function saveTask() {
            const taskData = {
                title: document.getElementById('taskTitle').value,
                enabled: document.getElementById('taskEnabled').checked,
                repeat_interval_min: parseInt(document.getElementById('interval').value),
                chat_id: parseInt(document.getElementById('chatId').value),
                day_start_hour: document.getElementById('dayStartHour').value ? parseInt(document.getElementById('dayStartHour').value) : null,
                day_end_hour: document.getElementById('dayEndHour').value ? parseInt(document.getElementById('dayEndHour').value) : null,
                text: document.getElementById('text').value,
                delete_previous: document.getElementById('deletePrevious').checked,
                pin_message: document.getElementById('pinMessage').checked,
            };

            // 处理开始/结束时间
            const startAt = document.getElementById('startAt').value;
            const endAt = document.getElementById('endAt').value;
            if (startAt) {
                taskData.start_at = Math.floor(new Date(startAt).getTime() / 1000);
            }
            if (endAt) {
                taskData.end_at = Math.floor(new Date(endAt).getTime() / 1000);
            }

            // 处理按钮数据
            const buttons = [];
            const rows = document.querySelectorAll('.button-row');
            rows.forEach(row => {
                const rowButtons = [];
                const items = row.querySelectorAll('.button-item');
                items.forEach(item => {
                    const text = item.querySelector('.button-text').value.trim();
                    const url = item.querySelector('.button-url').value.trim();
                    if (text && url) {
                        rowButtons.push({ text, url });
                    }
                });
                if (rowButtons.length > 0) {
                    buttons.push(rowButtons);
                }
            });
            taskData.buttons = buttons;

            try {
                const response = await fetch(`${apiBase}/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(taskData)
                });
                const data = await response.json();

                if (data.success) {
                    alert('✅ 保存成功！');
                } else {
                    alert('❌ 保存失败');
                }
            } catch (error) {
                console.error('Save error:', error);
                alert('❌ 保存失败: ' + error.message);
            }
        }

        // 加载日志
        async function loadLogs() {
            const container = document.getElementById('logsContainer');
            container.innerHTML = '<p class="text-muted">加载中...</p>';

            try {
                const response = await fetch(`${apiBase}/tasks/${taskId}/logs`);
                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    container.innerHTML = data.data.map(log => `
                        <div class="log-entry ${log.result}">
                            <div class="log-time">${new Date(log.send_at).toLocaleString()}</div>
                            <div class="log-status">
                                ${log.result === 'success' ? '✅ 成功' : '❌ 失败'}
                            </div>
                            ${log.error_message ? `<div class="log-error">${log.error_message}</div>` : ''}
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-muted">暂无日志</p>';
                }
            } catch (error) {
                container.innerHTML = '<p class="text-muted">加载失败</p>';
                console.error('Load logs error:', error);
            }
        }

        // 返回
        function goBack() {
            window.history.back();
        }

        // 页面加载完成后自动加载日志
        document.addEventListener('DOMContentLoaded', loadLogs);
    </script>
</body>
</html>
