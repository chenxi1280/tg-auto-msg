<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码登录 - Telegram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #0088cc 0%, #005f8c 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .qrcode-container {
            background: #f5f5f5;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .qrcode {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qrcode img {
            width: 180px;
            height: 180px;
            border-radius: 8px;
        }

        .qrcode.loading {
            background: #f0f0f0;
        }

        .qrcode.loading::after {
            content: "";
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top-color: #0088cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            min-height: 20px;
        }

        .status.success {
            color: #4caf50;
        }

        .status.error {
            color: #f44336;
        }

        .status.scanning {
            color: #0088cc;
        }

        .instructions {
            background: #f0f7ff;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
        }

        .instructions h3 {
            color: #0088cc;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .instructions ol {
            color: #666;
            font-size: 14px;
            padding-left: 20px;
            line-height: 1.8;
        }

        .refresh-btn {
            background: #0088cc;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .refresh-btn:hover {
            background: #006699;
            transform: translateY(-2px);
        }

        .refresh-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .logged-in {
            text-align: center;
            padding: 40px 20px;
        }

        .logged-in .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .logged-in h2 {
            color: #4caf50;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">✈️</div>
        <h1>Telegram 扫码登录</h1>
        <p class="subtitle">请使用 Telegram 扫码登录</p>

        <div id="login-content">
            <div class="qrcode-container">
                <div class="qrcode loading" id="qrcode">
                    <!-- 二维码将在这里生成 -->
                </div>
            </div>

            <p class="status" id="status">正在初始化登录...</p>

            <button class="refresh-btn" id="refresh-btn" onclick="refreshLogin()">
                刷新二维码
            </button>

            <div class="instructions">
                <h3>📱 登录步骤</h3>
                <ol>
                    <li>打开 Telegram 手机应用</li>
                    <li>点击 <strong>设置</strong> > <strong>设备</strong> > <strong>扫描二维码</strong></li>
                    <li>扫描上方二维码完成登录</li>
                </ol>
            </div>
        </div>

        <div id="logged-in-content" style="display: none;">
            <div class="logged-in">
                <div class="icon">✅</div>
                <h2>登录成功！</h2>
                <p>Userbot 已成功登录</p>
                <p style="margin-top: 20px; color: #999;">您可以关闭此页面返回 Bot</p>
            </div>
        </div>
    </div>

    <script>
        let currentLoginId = null;
        let checkInterval = null;

        // 初始化登录
        async function initLogin() {
            try {
                // 先检查是否已登录
                const checkResponse = await fetch('/api/login/check');
                const checkData = await checkResponse.json();

                if (checkData.success && checkData.data.is_logged_in) {
                    showLoggedIn();
                    return;
                }

                // 创建登录会话
                const response = await fetch('/api/login/create', {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    if (data.already_logged_in) {
                        showLoggedIn();
                        return;
                    }
                    currentLoginId = data.data.login_id;
                    startStatusCheck();
                    document.getElementById('status').textContent = '请使用 Telegram 扫描二维码';
                    document.getElementById('qrcode').classList.remove('loading');
                } else {
                    showError('创建登录会话失败');
                }
            } catch (error) {
                console.error('初始化登录失败:', error);
                showError('初始化失败，请重试');
            }
        }

        // 检查登录状态
        async function checkStatus() {
            if (!currentLoginId) return;

            try {
                const response = await fetch(`/api/login/status?login_id=${currentLoginId}`);
                const data = await response.json();

                if (data.success) {
                    const status = data.data.status;
                    const statusEl = document.getElementById('status');

                    switch (status) {
                        case 'pending':
                            // 等待扫码
                            break;
                        case 'scanning':
                            statusEl.textContent = '已扫描，请在手机上确认登录';
                            statusEl.classList.add('scanning');
                            break;
                        case 'confirmed':
                            showLoggedIn();
                            stopStatusCheck();
                            break;
                        case 'expired':
                            statusEl.textContent = '二维码已过期，请刷新';
                            statusEl.classList.add('error');
                            stopStatusCheck();
                            break;
                        case 'error':
                            showError(data.data.error || '登录失败');
                            stopStatusCheck();
                            break;
                    }
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
            }
        }

        // 开始状态检查
        function startStatusCheck() {
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(checkStatus, 2000);
        }

        // 停止状态检查
        function stopStatusCheck() {
            if (checkInterval) {
                clearInterval(checkInterval);
                checkInterval = null;
            }
        }

        // 显示错误
        function showError(message) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.classList.add('error');
            document.getElementById('qrcode').classList.remove('loading');
        }

        // 显示已登录状态
        function showLoggedIn() {
            stopStatusCheck();
            document.getElementById('login-content').style.display = 'none';
            document.getElementById('logged-in-content').style.display = 'block';
        }

        // 刷新登录
        function refreshLogin() {
            stopStatusCheck();
            document.getElementById('qrcode').classList.add('loading');
            document.getElementById('status').textContent = '正在刷新...';
            document.getElementById('status').classList.remove('error', 'success', 'scanning');
            document.getElementById('refresh-btn').disabled = true;
            setTimeout(() => {
                document.getElementById('refresh-btn').disabled = false;
            }, 3000);
            initLogin();
        }

        // 页面加载时初始化登录
        window.addEventListener('load', initLogin);

        // 页面卸载时清理
        window.addEventListener('beforeunload', stopStatusCheck);
    </script>
</body>
</html>
